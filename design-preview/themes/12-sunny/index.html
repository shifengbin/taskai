/* =========================================================================
   12 · SUNNY — vibrant gradient consumer (bright, readable)
   ========================================================================= */
.d-sunny .stage{border:1px solid var(--g-line); border-radius:20px; background:var(--g-bg); overflow:hidden; box-shadow:0 30px 70px -34px rgba(80,40,140,.4)}
.d-sunny.light{--g-bg:#FBF6FF;--g-surface:#FFFFFF;--g-surface2:#F4EEFF;--g-ink:#241B3A;--g-mut:#6E6488;--g-line:#ECE3FA;--g-accent:#FF3D8B;--g-accent2:#6D5EF5;
  --g-grad-sun:linear-gradient(135deg,#FF7A45,#FF3D8B);--g-grad-ocean:linear-gradient(135deg,#3B82F6,#06B6D4);
  --g-work:#16A34A;--g-idle:#C3BBD6;--g-unread:#6D5EF5;--g-error:#F43F5E}
.d-sunny.dark{--g-bg:#15111F;--g-surface:#1F1830;--g-surface2:#291F3E;--g-ink:#F4EFFE;--g-mut:#9C93BE;--g-line:#332A4B;--g-accent:#FF5C9C;--g-accent2:#8B7CFF;
  --g-grad-sun:linear-gradient(135deg,#FF8A5C,#FF4D94);--g-grad-ocean:linear-gradient(135deg,#4D8DFF,#1FCDE0);
  --g-work:#22C55E;--g-idle:#564C72;--g-unread:#8B7CFF;--g-error:#FB4869}
.d-sunny{font-family:'Plus Jakarta Sans',sans-serif}
.d-sunny .stage-bar{background:var(--g-surface); border-bottom:1px solid var(--g-line); justify-content:center; position:relative}
.d-sunny .tl{position:absolute; left:18px}
.d-sunny .tl i{background:#ECE3FA}.d-sunny .tl i:nth-child(1){background:var(--g-accent)}.d-sunny .tl i:nth-child(2){background:var(--g-accent2)}.d-sunny .tl i:nth-child(3){background:#06B6D4}
.d-sunny.dark .tl i{background:#332A4B}
.d-sunny .win-title{font-family:'Lexend'; font-weight:500; font-size:13px; color:var(--g-mut)}
.d-sunny .appbar{border-bottom:1px solid var(--g-line); background:var(--g-surface)}
.d-sunny .brand-name{font-family:'Lexend'; font-weight:700; font-size:21px; letter-spacing:-.02em; background:var(--g-grad-sun); -webkit-background-clip:text; background-clip:text; color:transparent}
.d-sunny .brand-mark{background:var(--g-grad-sun); border-radius:10px; color:#fff; box-shadow:0 6px 16px -4px rgba(255,61,139,.5)}
.d-sunny .brand-mark svg{width:15px;height:15px;stroke-width:2.6}
.d-sunny .iconbtn{border-radius:11px; color:var(--g-ink); border:1px solid var(--g-line); background:var(--g-surface)}
.d-sunny .iconbtn:hover{border-color:var(--g-accent); color:var(--g-accent)}
.d-sunny .iconbtn svg{stroke-width:2}
.d-sunny .sidebar{border-right:1px solid var(--g-line); background:var(--g-surface)}
.d-sunny .side-head{border-bottom:1px solid var(--g-line)}
.d-sunny .side-label{font-family:'Lexend'; font-weight:600; font-size:12px; color:var(--g-mut)}
.d-sunny .tabs{border-bottom:1px solid var(--g-line)}
.d-sunny .tab{font-family:'Plus Jakarta Sans'; font-weight:700; font-size:13px; color:var(--g-mut); position:relative}
.d-sunny .tab.active{color:var(--g-ink)}
.d-sunny .tab.active em{color:var(--g-accent)}
.d-sunny .tab.active::after{content:""; position:absolute; left:28%; right:28%; bottom:-1px; height:3px; background:var(--g-grad-sun); border-radius:3px}
.d-sunny .task{border-left:none}
.d-sunny .task-row{border-radius:13px; margin:4px 8px; box-shadow:inset 4px 0 0 var(--c); background:var(--g-surface2)}
.d-sunny .task-row:hover{background:var(--g-surface)}
.d-sunny .task-title{font-family:'Plus Jakarta Sans'; font-weight:700; font-size:14px}
.d-sunny .task-sub{color:var(--g-mut)}
.d-sunny .term{color:var(--g-mut); border-radius:9px}
.d-sunny .term:hover{background:var(--g-surface2)}
.d-sunny .dot.idle{background:var(--g-idle)}
.d-sunny .dot.working{background:var(--g-work)}.d-sunny .dot.working::before{border-color:var(--g-work)}
.d-sunny .dot.unread{background:var(--g-unread)}.d-sunny .dot.unread::before{border-color:var(--g-unread)}
.d-sunny .dot.error{background:var(--g-error)}
.d-sunny .pane{background:var(--g-bg)}
.d-sunny .term-head{border-bottom:1px solid var(--g-line); background:var(--g-surface)}
.d-sunny .term-tab{font-family:'Plus Jakarta Sans'; font-weight:700; color:var(--g-mut)}
.d-sunny .term-tab.active{color:#fff; background:var(--g-grad-ocean); border-radius:8px 8px 0 0}
.d-sunny .term-meta{font-family:'Lexend'; font-weight:600; font-size:12px; color:var(--g-work)}
.d-sunny .term-body{font-family:'JetBrains Mono',monospace; color:var(--g-ink)}
.d-sunny .t-prompt{color:var(--g-accent)}
.d-sunny .t-ok{color:var(--g-work)}
.d-sunny .t-key{color:var(--g-accent2)}
.d-sunny .t-url{color:var(--g-accent)}
.d-sunny .t-info{color:var(--g-unread)}


</style>
