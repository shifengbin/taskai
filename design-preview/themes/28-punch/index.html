.d-punch .stage{border:3.5px solid var(--pu-outline); border-radius:6px; background:var(--pu-bg); overflow:hidden; box-shadow:11px 11px 0 var(--pu-outline)}

.d-punch{font-family:'Plus Jakarta Sans',sans-serif}
.d-punch .stage-bar{background:var(--pu-accent3); border-bottom:3.5px solid var(--pu-outline); justify-content:flex-start}
.d-punch .tl i{border:2px solid var(--pu-outline); background:var(--pu-surface)}
.d-punch .tl i:nth-child(1){background:var(--pu-accent)}.d-punch .tl i:nth-child(2){background:var(--pu-accent2)}
.d-punch .win-title{font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:13px; color:#0A0A0A; letter-spacing:.02em}
.d-punch .appbar{border-bottom:3.5px solid var(--pu-outline); background:var(--pu-surface)}
.d-punch .brand-name{font-family:'Climate Crisis',sans-serif; font-weight:400; font-size:21px; letter-spacing:0; line-height:1; text-transform:uppercase}
.d-punch .brand-name em{font-style:normal; color:var(--pu-accent)}

.d-punch .iconbtn svg{stroke-width:2.4}

.d-punch .tabs{border-bottom:3.5px solid var(--pu-outline)}
.d-punch .tab{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:12.5px; color:var(--pu-ink); border-right:2.5px solid var(--pu-outline)}
.d-punch .tab:last-child{border-right:none}
.d-punch .tab.active{background:var(--pu-accent); color:#fff}
.d-punch .tab.active em{color:#fff}
.d-punch .task{border-left:none}

.d-punch .task-title{font-family:'Plus Jakarta Sans'; font-weight:800}
.d-punch .task-sub{color:var(--pu-mut); font-weight:600}
.d-punch .term{border:2.5px solid var(--pu-outline); border-radius:6px; margin:4px 10px; box-shadow:2.5px 2.5px 0 var(--pu-outline); background:var(--pu-surface2); color:var(--pu-ink)}
.d-punch .term:hover{transform:translate(-1px,-1px); box-shadow:3.5px 3.5px 0 var(--pu-outline)}
.d-punch .dot.idle{background:var(--pu-idle)}
.d-punch .dot.working{background:var(--pu-work)}.d-punch .dot.working::before{border-color:var(--pu-work)}
.d-punch .dot.unread{background:var(--pu-unread)}.d-punch .dot.unread::before{border-color:var(--pu-unread)}
.d-punch .dot.error{background:var(--pu-error)}
.d-punch .pane{background:var(--pu-bg)}
.d-punch .term-head{border-bottom:3.5px solid var(--pu-outline); background:var(--pu-surface2)}
.d-punch .term-tab{font-family:'Plus Jakarta Sans'; font-weight:800; color:var(--pu-ink); border:2.5px solid var(--pu-outline); border-bottom:none; background:var(--pu-surface); border-radius:7px 7px 0 0}
.d-punch .term-tab.active{background:var(--pu-accent2); color:#fff}
.d-punch .term-meta{font-family:'Plus Jakarta Sans'; font-weight:800; font-size:11px; text-transform:uppercase; color:var(--pu-work)}
.d-punch .term-body{font-family:'JetBrains Mono',monospace; color:var(--pu-ink); background-color:var(--pu-surface); background-image:radial-gradient(var(--pu-dots) 1.3px, transparent 1.3px); background-size:15px 15px}
.d-punch .t-prompt{color:var(--pu-accent)}
.d-punch .t-ok{color:var(--pu-work)}
.d-punch .t-key{color:var(--pu-accent2)}
.d-punch .t-url{color:var(--pu-accent)}
.d-punch .t-info{color:var(--pu-unread)}
