.d-zap .stage{border:3px solid var(--zp-outline); border-radius:4px; background:var(--zp-bg); overflow:hidden; box-shadow:8px 8px 0 var(--zp-outline)}

.d-zap{font-family:'DM Sans',sans-serif}
.d-zap .stage-bar{background:var(--zp-accent); border-bottom:3px solid var(--zp-outline); justify-content:flex-start}

.d-zap .brand-name em{font-style:normal; color:var(--zp-accent2)}

.d-zap .tab:last-child{border-right:none}

.d-zap .term:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--zp-outline)}
.d-zap .dot.idle{background:var(--zp-idle)}
.d-zap .dot.working{background:var(--zp-work)}.d-zap .dot.working::before{border-color:var(--zp-work)}

.d-zap .pane{background:var(--zp-bg)}
.d-zap .term-head{border-bottom:3px solid var(--zp-outline); background:var(--zp-surface2)}
.d-zap .term-tab{font-family:'DM Sans'; font-weight:700; color:var(--zp-ink); border:2px solid var(--zp-outline); border-bottom:none; background:var(--zp-surface); border-radius:5px 5px 0 0}

.d-zap.dark .term-tab.active{color:#06101F}
.d-zap .term-meta{font-family:'Bungee'; font-weight:400; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--zp-work)}
.d-zap .term-body{font-family:'JetBrains Mono',monospace; color:var(--zp-ink); background-color:var(--zp-surface); background-image:radial-gradient(var(--zp-dots) 1.3px, transparent 1.3px); background-size:15px 15px}

.d-zap .t-ok{color:var(--zp-work)}
.d-zap .t-key{color:var(--zp-accent)}

.d-zap .t-info{color:var(--zp-unread)}
