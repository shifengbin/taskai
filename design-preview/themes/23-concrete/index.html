.d-concrete .stage{border:2.5px solid var(--co-frame); border-radius:11px; background:var(--co-bg); overflow:hidden; box-shadow:6px 6px 0 var(--co-frame)}

.d-concrete{font-family:'Figtree',sans-serif}

.d-concrete .tl i:nth-child(1){background:var(--co-accent)}.d-concrete .tl i:nth-child(2){background:var(--co-accent2)}.d-concrete .tl i:nth-child(3){background:#6A6F78}

.d-concrete .brand-name em{font-style:normal; color:var(--co-accent)}
.d-concrete .brand-mark{background:var(--co-accent); border-radius:7px; color:#fff}

.d-concrete .iconbtn svg{stroke-width:2.4}
.d-concrete .sidebar{border-right:2.5px solid var(--co-frame); background:var(--co-surface)}
.d-concrete .side-head{border-bottom:1.5px solid var(--co-line)}
.d-concrete .side-label{font-family:'Syne',sans-serif; font-weight:800; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--co-ink)}
.d-concrete .tabs{border-bottom:2.5px solid var(--co-frame)}
.d-concrete .tab{font-family:'Figtree'; font-weight:700; font-size:12.5px; color:var(--co-mut); border-right:1.5px solid var(--co-line)}
.d-concrete .tab:last-child{border-right:none}
.d-concrete .tab.active{background:var(--co-accent); color:#fff}
.d-concrete .tab.active em{color:#fff}
.d-concrete .task{border-left:none}
.d-concrete .task-row{border:1.5px solid var(--co-line); border-radius:10px; margin:6px 8px; box-shadow:inset 5px 0 0 var(--c); background:var(--co-surface2)}
.d-concrete .task-row:hover{border-color:var(--co-frame)}
.d-concrete .task-title{font-family:'Figtree'; font-weight:700; font-size:14px}
.d-concrete .task-sub{color:var(--co-mut)}
.d-concrete .term{color:var(--co-mut); border-radius:7px}
.d-concrete .term:hover{background:var(--co-surface2)}
.d-concrete .dot.idle{background:var(--co-idle)}
.d-concrete .dot.working{background:var(--co-work)}.d-concrete .dot.working::before{border-color:var(--co-work)}
.d-concrete .dot.unread{background:var(--co-unread)}.d-concrete .dot.unread::before{border-color:var(--co-unread)}
.d-concrete .dot.error{background:var(--co-error)}
.d-concrete .pane{background:var(--co-bg)}
.d-concrete .term-head{border-bottom:2px solid var(--co-frame); background:var(--co-surface)}
.d-concrete .term-tab{font-family:'Figtree'; font-weight:700; color:var(--co-mut); border:1.5px solid var(--co-line); border-bottom:none; background:var(--co-surface2)}
.d-concrete .term-tab.active{background:var(--co-accent2); color:#fff}
.d-concrete .term-meta{font-family:'Syne',sans-serif; font-weight:800; font-size:11px; text-transform:uppercase; color:var(--co-work)}
.d-concrete .term-body{font-family:'JetBrains Mono',monospace; color:var(--co-ink)}
.d-concrete .t-prompt{color:var(--co-accent)}
.d-concrete .t-ok{color:var(--co-work)}
.d-concrete .t-key{color:var(--co-accent2)}
.d-concrete .t-url{color:var(--co-accent)}
.d-concrete .t-info{color:var(--co-unread)}
