.d-neon .stage{border:2.5px solid var(--ne-frame); border-radius:13px; background:var(--ne-bg); overflow:hidden; box-shadow:6px 6px 0 var(--ne-frame)}

.d-neon .tl i:nth-child(1){background:var(--ne-accent)}.d-neon .tl i:nth-child(2){background:var(--ne-accent2)}.d-neon .tl i:nth-child(3){background:#6A6A7A}

.d-neon .iconbtn svg{stroke-width:2.4}
.d-neon .sidebar{border-right:2.5px solid var(--ne-frame); background:var(--ne-surface)}
.d-neon .side-head{border-bottom:1.5px solid var(--ne-line)}
.d-neon .side-label{font-family:'Lexend'; font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ne-ink)}
.d-neon .tabs{border-bottom:2.5px solid var(--ne-frame)}
.d-neon .tab{font-family:'Lexend'; font-weight:600; font-size:12.5px; color:var(--ne-mut); border-right:1.5px solid var(--ne-line)}
.d-neon .tab:last-child{border-right:none}
.d-neon .tab.active{background:var(--ne-accent); color:#001824}
.d-neon .tab.active em{color:#001824}
.d-neon .task{border-left:none}
.d-neon .task-row{border:1.5px solid var(--ne-line); border-radius:11px; margin:6px 8px; box-shadow:inset 5px 0 0 var(--c); background:var(--ne-surface2)}
.d-neon .task-row:hover{border-color:var(--ne-frame)}
.d-neon .task-title{font-family:'Lexend'; font-weight:600; font-size:14px}
.d-neon .task-sub{color:var(--ne-mut)}
.d-neon .term{color:var(--ne-mut); border-radius:8px}

.d-neon .dot.idle{background:var(--ne-idle)}
.d-neon .dot.working{background:var(--ne-work)}.d-neon .dot.working::before{border-color:var(--ne-work)}
.d-neon .dot.unread{background:var(--ne-unread)}.d-neon .dot.unread::before{border-color:var(--ne-unread)}
.d-neon .dot.error{background:var(--ne-error)}
.d-neon .pane{background:var(--ne-bg)}
.d-neon .term-head{border-bottom:2px solid var(--ne-frame); background:var(--ne-surface)}
.d-neon .term-tab{font-family:'Lexend'; font-weight:600; color:var(--ne-mut); border:1.5px solid var(--ne-line); border-bottom:none; background:var(--ne-surface2)}

.d-neon .term-meta{font-family:'Lexend'; font-weight:700; font-size:11px; text-transform:uppercase; color:var(--ne-work)}
.d-neon .term-body{font-family:'JetBrains Mono',monospace; color:var(--ne-ink)}
.d-neon .t-prompt{color:var(--ne-accent)}
.d-neon .t-ok{color:var(--ne-work)}
.d-neon .t-key{color:var(--ne-accent2)}
.d-neon .t-url{color:var(--ne-accent)}
.d-neon .t-info{color:var(--ne-unread)}
