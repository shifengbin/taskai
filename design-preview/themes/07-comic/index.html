/* =========================================================================
   07 · COMIC — manga / comic book
   ========================================================================= */
.d-comic .stage{border:3px solid var(--c-ink); border-radius:14px; background:var(--c-bg); overflow:hidden; box-shadow:7px 7px 0 var(--c-ink)}
.d-comic.light{--c-bg:#FFFDF5;--c-surface:#FFFFFF;--c-surface2:#FFF1B8;--c-ink:#14110F;--c-mut:#6E6356;--c-accent:#E63027;--c-accent2:#2D6CDF;--c-dots:rgba(20,17,15,.10);
  --c-work:#1FA85A;--c-idle:#9A9081;--c-unread:#2D6CDF;--c-error:#E63027}
.d-comic.dark{--c-bg:#14110F;--c-surface:#1F1B16;--c-surface2:#2A2417;--c-ink:#F5F0E6;--c-mut:#8A7E6E;--c-accent:#FF4136;--c-accent2:#4D8DEE;--c-dots:rgba(245,240,230,.10);
  --c-work:#37D378;--c-idle:#5E5747;--c-unread:#4D8DEE;--c-error:#FF4136}
.d-comic{font-family:'Comic Neue',sans-serif}
.d-comic .stage-bar{background-color:var(--c-accent); background-image:radial-gradient(var(--c-dots) 1.5px,transparent 1.5px); background-size:9px 9px; border-bottom:3px solid var(--c-ink); justify-content:flex-start}
.d-comic .tl i{border:2px solid var(--c-ink); background:var(--c-surface)}
.d-comic .tl i:nth-child(1){background:var(--c-accent)}
.d-comic .win-title{font-family:'Bangers',cursive; font-weight:400; font-size:19px; letter-spacing:.05em; text-transform:uppercase; color:#fff}
.d-comic .appbar{border-bottom:3px solid var(--c-ink); background:var(--c-surface)}
.d-comic .brand-name{font-family:'Bangers',cursive; font-weight:400; font-size:27px; letter-spacing:.03em; text-transform:uppercase; line-height:1}
.d-comic .brand-name em{font-style:normal; color:var(--c-accent)}
.d-comic .brand-mark{background:var(--c-accent); border:2.5px solid var(--c-ink); border-radius:7px; color:#fff}
.d-comic .brand-mark svg{width:14px;height:14px;stroke-width:3.5}
.d-comic .iconbtn{border:2.5px solid var(--c-ink); border-radius:8px; background:var(--c-surface); box-shadow:2.5px 2.5px 0 var(--c-ink)}
.d-comic .iconbtn:hover{transform:translate(-1px,-1px); box-shadow:3.5px 3.5px 0 var(--c-ink)}
.d-comic .iconbtn svg{stroke-width:2.5}
.d-comic .sidebar{border-right:3px solid var(--c-ink); background:var(--c-surface)}
.d-comic .side-head{border-bottom:2.5px solid var(--c-ink)}
.d-comic .side-label{font-family:'Bangers'; font-weight:400; font-size:16px; letter-spacing:.05em; text-transform:uppercase; color:var(--c-ink)}
.d-comic .tabs{border-bottom:3px solid var(--c-ink)}
.d-comic .tab{font-family:'Bangers'; font-weight:400; font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:var(--c-ink); border-right:2.5px solid var(--c-ink)}
.d-comic .tab:last-child{border-right:none}
.d-comic .tab.active{background:var(--c-ink); color:var(--c-bg)}
.d-comic .tab.active em{color:var(--c-accent)}
.d-comic .task{border-left:none}
.d-comic .task-row{border:2.5px solid var(--c-ink); border-radius:11px; margin:7px 8px; box-shadow:3px 3px 0 var(--c-ink), inset 5px 0 0 var(--c)}
.d-comic .task-row:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--c-ink), inset 5px 0 0 var(--c)}
.d-comic .task-title{font-family:'Comic Neue'; font-weight:700; font-size:14px}
.d-comic .task-sub{color:var(--c-mut)}
.d-comic .term{border:2px solid var(--c-ink); border-radius:8px; margin:4px 10px; box-shadow:2px 2px 0 var(--c-ink); background:var(--c-surface2); color:var(--c-ink)}
.d-comic .term:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--c-ink)}
.d-comic .dot.idle{background:var(--c-idle)}
.d-comic .dot.working{background:var(--c-work)}.d-comic .dot.working::before{border-color:var(--c-work)}
.d-comic .dot.unread{background:var(--c-unread)}.d-comic .dot.unread::before{border-color:var(--c-unread)}
.d-comic .dot.error{background:var(--c-error)}
.d-comic .pane{background-color:var(--c-bg); background-image:radial-gradient(var(--c-dots) 1.3px,transparent 1.3px); background-size:13px 13px}
.d-comic .term-head{border-bottom:3px solid var(--c-ink); background:var(--c-surface)}
.d-comic .term-tab{font-family:'Comic Neue'; font-weight:700; color:var(--c-ink); border:2.5px solid var(--c-ink); border-bottom:none; background:var(--c-surface2); border-radius:9px 9px 0 0}
.d-comic .term-tab.active{background:var(--c-accent); color:#fff}
.d-comic .term-meta{font-family:'Bangers'; font-size:14px; color:var(--c-work)}
.d-comic .term-body{font-family:'JetBrains Mono',monospace; color:var(--c-ink)}
.d-comic .t-prompt{color:var(--c-accent)}
.d-comic .t-ok{color:var(--c-work)}
.d-comic .t-key{color:var(--c-accent2)}
.d-comic .t-url{color:var(--c-accent)}
.d-comic .t-info{color:var(--c-unread)}


</style>
