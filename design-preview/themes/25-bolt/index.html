/* =========================================================================
   25 · BOLT — electric tech-pop (Pop family)
   ========================================================================= */
.d-bolt .stage{border:3px solid var(--bt-outline); border-radius:8px; background:var(--bt-bg); overflow:hidden; box-shadow:9px 9px 0 var(--bt-outline)}
.d-bolt.light{--bt-bg:#EEF2EC;--bt-surface:#FFFFFF;--bt-surface2:#E2EAE2;--bt-ink:#08120F;--bt-mut:#5A6B62;--bt-outline:#08120F;--bt-accent:#A6FF3C;--bt-accent2:#2B6FFF;--bt-accent3:#FF7A1A;--bt-accent4:#FF2E93;--bt-dots:rgba(8,18,15,.06);
  --bt-work:#1FAA4F;--bt-idle:#9AA8A2;--bt-unread:#FF2E93;--bt-error:#E63946}
.d-bolt.dark{--bt-bg:#0A1411;--bt-surface:#13201A;--bt-surface2:#1B2C24;--bt-ink:#E8F0EA;--bt-mut:#8FA59A;--bt-outline:#E8F0EA;--bt-accent:#BFFF5C;--bt-accent2:#2B6FFF;--bt-accent3:#FF8A3A;--bt-accent4:#FF5CAD;--bt-dots:rgba(232,240,234,.06);
  --bt-work:#3DD97A;--bt-idle:#5C6B64;--bt-unread:#FF5CAD;--bt-error:#FF5C5C}
.d-bolt{font-family:'Hanken Grotesk',sans-serif}
.d-bolt .stage-bar{background-color:var(--bt-accent2); background-image:repeating-linear-gradient(45deg, var(--bt-accent3) 0 9px, transparent 9px 18px); border-bottom:3px solid var(--bt-outline); justify-content:flex-start}
.d-bolt .tl i{border:2px solid var(--bt-outline); background:var(--bt-surface)}
.d-bolt .tl i:nth-child(1){background:var(--bt-accent)}.d-bolt .tl i:nth-child(2){background:var(--bt-accent2)}
.d-bolt .win-title{font-family:'Sora',sans-serif; font-weight:700; font-size:13px; color:#06120A}
.d-bolt .appbar{border-bottom:3px solid var(--bt-outline); background:var(--bt-surface)}
.d-bolt .brand-name{font-family:'Sora',sans-serif; font-weight:800; font-size:22px; letter-spacing:-.02em}
.d-bolt .brand-name em{font-style:normal; color:var(--bt-accent2)}
.d-bolt .brand-mark{background:var(--bt-accent); border:2.5px solid var(--bt-outline); border-radius:7px; color:#06120A}
.d-bolt .brand-mark svg{width:14px;height:14px;stroke-width:3}
.d-bolt .iconbtn{border:2px solid var(--bt-outline); border-radius:8px; background:var(--bt-surface); color:var(--bt-ink); box-shadow:2px 2px 0 var(--bt-outline)}
.d-bolt .iconbtn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--bt-outline)}
.d-bolt .iconbtn svg{stroke-width:2.2}
.d-bolt .sidebar{border-right:3px solid var(--bt-outline); background:var(--bt-surface)}
.d-bolt .side-head{border-bottom:2px solid var(--bt-outline)}
.d-bolt .side-label{font-family:'Sora'; font-weight:700; font-size:12px; text-transform:uppercase; color:var(--bt-ink)}
.d-bolt .tabs{border-bottom:3px solid var(--bt-outline)}
.d-bolt .tab{font-family:'Sora'; font-weight:700; font-size:12.5px; color:var(--bt-ink); border-right:2px solid var(--bt-outline)}
.d-bolt .tab:last-child{border-right:none}
.d-bolt .tab.active{background:var(--bt-accent); color:#06120A}
.d-bolt .tab.active em{color:#06120A}
.d-bolt .task{border-left:none}
.d-bolt .task-row{border:2.5px solid var(--bt-outline); border-radius:9px; margin:7px 8px; box-shadow:3px 3px 0 var(--bt-outline), inset 5px 0 0 var(--c); background:var(--bt-surface)}
.d-bolt .task-row:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--bt-outline), inset 5px 0 0 var(--c)}
.d-bolt .task-title{font-family:'Sora'; font-weight:700}
.d-bolt .task-sub{color:var(--bt-mut); font-weight:500}
.d-bolt .term{border:2px solid var(--bt-outline); border-radius:8px; margin:4px 10px; box-shadow:2px 2px 0 var(--bt-outline); background:var(--bt-surface2); color:var(--bt-ink)}
.d-bolt .term:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--bt-outline)}
.d-bolt .dot.idle{background:var(--bt-idle)}
.d-bolt .dot.working{background:var(--bt-work)}.d-bolt .dot.working::before{border-color:var(--bt-work)}
.d-bolt .dot.unread{background:var(--bt-unread)}.d-bolt .dot.unread::before{border-color:var(--bt-unread)}
.d-bolt .dot.error{background:var(--bt-error)}
.d-bolt .pane{background:var(--bt-bg)}
.d-bolt .term-head{border-bottom:3px solid var(--bt-outline); background:var(--bt-surface2)}
.d-bolt .term-tab{font-family:'Sora'; font-weight:700; color:var(--bt-ink); border:2px solid var(--bt-outline); border-bottom:none; background:var(--bt-surface); border-radius:9px 9px 0 0}
.d-bolt .term-tab.active{background:var(--bt-accent2); color:#fff}
.d-bolt .term-meta{font-family:'Sora'; font-weight:700; font-size:11px; text-transform:uppercase; color:var(--bt-work)}
.d-bolt .term-body{font-family:'JetBrains Mono',monospace; color:var(--bt-ink); background-color:var(--bt-surface); background-image:radial-gradient(var(--bt-dots) 1.3px, transparent 1.3px); background-size:15px 15px}
.d-bolt .t-prompt{color:var(--bt-accent2)}
.d-bolt .t-ok{color:var(--bt-work)}
.d-bolt .t-key{color:var(--bt-accent4)}
.d-bolt .t-url{color:var(--bt-accent3)}
.d-bolt .t-info{color:var(--bt-unread)}


</style>
