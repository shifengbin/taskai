.d-wabi .stage{border:1px solid var(--w-line); border-top:3px solid var(--w-accent); background:var(--w-bg); border-radius:6px; overflow:hidden; box-shadow:0 30px 70px -34px rgba(0,0,0,.45)}

.d-wabi .brand-mark svg{display:none}
.d-wabi .iconbtn{border-radius:999px; color:var(--w-mut)}
.d-wabi .iconbtn:hover{background:var(--w-surface2); color:var(--w-ink)}

.d-wabi .sidebar{border-right:1px solid var(--w-line); background:var(--w-surface)}
.d-wabi .side-head{border-bottom:1px solid var(--w-line)}

.d-wabi .tabs{border-bottom:1px solid var(--w-line)}
.d-wabi .tab{color:var(--w-mut); font-size:12.5px; letter-spacing:.04em}
.d-wabi .tab.active{color:var(--w-ink); box-shadow:inset 0 -2px 0 var(--w-accent)}
.d-wabi .tab.active em{color:var(--w-accent)}
.d-wabi .task{border-left:none}
.d-wabi .task-row{box-shadow:inset 2px 0 0 var(--c)}
.d-wabi .task-row:hover{background:var(--w-surface2)}
.d-wabi .task-title{font-weight:500; letter-spacing:.01em}
.d-wabi .task-sub{color:var(--w-mut)}
.d-wabi .term{color:var(--w-mut)}
.d-wabi .term:hover{background:var(--w-surface2)}
.d-wabi .dot.idle{background:var(--w-idle)}
.d-wabi .dot.working{background:var(--w-work)}.d-wabi .dot.working::before{border-color:var(--w-work)}

.d-wabi .dot.error{background:var(--w-error)}
.d-wabi .pane{background:var(--w-bg)}
.d-wabi .term-head{border-bottom:1px solid var(--w-line); background:var(--w-surface)}
.d-wabi .term-tab{color:var(--w-mut)}
.d-wabi .term-tab.active{color:var(--w-ink); box-shadow:inset 0 -2px 0 var(--w-accent)}
.d-wabi .term-meta{color:var(--w-work); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px}
.d-wabi .term-body{font-family:'JetBrains Mono',monospace; color:var(--w-ink)}
.d-wabi .t-prompt{color:var(--w-accent)}
.d-wabi .t-ok{color:var(--w-work)}
.d-wabi .t-url{color:var(--w-accent)}
.d-wabi .t-info{color:var(--w-unread)}
