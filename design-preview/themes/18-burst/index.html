.d-burst .stage{border:1px solid var(--bu-line); border-radius:20px; background:var(--bu-bg); overflow:hidden; box-shadow:0 30px 70px -36px rgba(40,80,160,.4)}
.d-burst.light{--bu-bg:#F7FBFF;--bu-surface:#FFFFFF;--bu-surface2:#EAF2FF;--bu-ink:#182238;--bu-mut:#6E7A95;--bu-line:#DCE6F5;--bu-accent:#FF5C5C;--bu-accent2:#3DA5F4;--bu-accent3:#22C186;--bu-accent4:#FFB237;

.d-burst .tl{position:absolute; left:18px}
.d-burst.light .tl i{background:#DCE6F5}.d-burst.light .tl i:nth-child(1){background:#FF5C5C}.d-burst.light .tl i:nth-child(2){background:#FFB237}.d-burst.light .tl i:nth-child(3){background:#22C186}
.d-burst.dark .tl i{background:#2C3658}.d-burst.dark .tl i:nth-child(1){background:#FF6B6B}.d-burst.dark .tl i:nth-child(2){background:#FFC04D}.d-burst.dark .tl i:nth-child(3){background:#2BD693}
.d-burst .win-title{font-family:'Titan One',cursive; font-weight:400; font-size:15px; color:var(--bu-mut)}
.d-burst .appbar{border-bottom:1px solid var(--bu-line); background:var(--bu-surface)}
.d-burst .brand-name{font-family:'Titan One'; font-weight:400; font-size:22px; letter-spacing:-.01em}
.d-burst .brand-name em{font-style:normal; color:var(--bu-accent)}

.d-burst .brand-mark svg{width:15px;height:15px;stroke-width:2.8}

.d-burst .iconbtn svg{stroke-width:2.2}

.d-burst .side-head{border-bottom:1px solid var(--bu-line)}

.d-burst .tabs{border-bottom:1px solid var(--bu-line)}
.d-burst .tab{font-family:'Comfortaa'; font-weight:700; font-size:13px; color:var(--bu-mut); position:relative}
.d-burst .tab.active{color:var(--bu-ink)}
.d-burst .tab.active em{color:var(--bu-accent)}
.d-burst .tab.active::after{content:""; position:absolute; left:28%; right:28%; bottom:-1px; height:3px; background:linear-gradient(90deg,#FF5C5C,#FFB237,#22C186,#3DA5F4); border-radius:3px}
.d-burst .task{border-left:none}
.d-burst .task-row{border-radius:14px; margin:4px 8px; box-shadow:inset 4px 0 0 var(--c); background:var(--bu-surface2)}
.d-burst .task-row:hover{background:var(--bu-surface)}
.d-burst .task-title{font-family:'Comfortaa'; font-weight:700; font-size:14px}
.d-burst .task-sub{color:var(--bu-mut)}
.d-burst .term{color:var(--bu-mut); border-radius:10px}
.d-burst .term:hover{background:var(--bu-surface2)}
.d-burst .dot.idle{background:var(--bu-idle)}
.d-burst .dot.working{background:var(--bu-work)}.d-burst .dot.working::before{border-color:var(--bu-work)}
.d-burst .dot.unread{background:var(--bu-unread)}.d-burst .dot.unread::before{border-color:var(--bu-unread)}
.d-burst .dot.error{background:var(--bu-error)}
.d-burst .pane{position:relative; background:var(--bu-bg)}
.d-burst .pane::before{content:""; position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.5;

.d-burst .term-head{position:relative; z-index:1; border-bottom:1px solid var(--bu-line); background:var(--bu-surface)}
.d-burst .term-tab{font-family:'Comfortaa'; font-weight:700; color:var(--bu-mut)}
.d-burst .term-tab.active{color:#fff; background:linear-gradient(135deg,var(--bu-accent),var(--bu-accent4)); border-radius:9px 9px 0 0}
.d-burst .term-meta{font-family:'Titan One'; font-size:12px; color:var(--bu-work)}
.d-burst .term-body{position:relative; z-index:1; font-family:'JetBrains Mono',monospace; color:var(--bu-ink); background:var(--bu-surface)}
.d-burst .t-prompt{color:var(--bu-accent)}
.d-burst .t-ok{color:var(--bu-work)}
.d-burst .t-key{color:var(--bu-accent2)}
.d-burst .t-url{color:var(--bu-accent)}
.d-burst .t-info{color:var(--bu-unread)}
