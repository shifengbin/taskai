.d-crayon .stage{border:3px solid var(--cy-outline); border-radius:18px; background:var(--cy-bg); overflow:hidden; box-shadow:9px 9px 0 var(--cy-outline)}
.d-crayon.light{--cy-bg:#FFFCF3;--cy-surface:#FFFFFF;--cy-surface2:#FFF0D6;--cy-ink:#1F1A2E;--cy-mut:#6E6878;--cy-outline:#1F1A2E;--cy-accent:#FF4D4D;--cy-accent2:#36B5FF;--cy-accent3:#FFC93C;--cy-accent4:#4CC66B;--cy-dots:rgba(31,26,46,.06);

.d-crayon.dark{--cy-bg:#14102B;--cy-surface:#1F1A3A;--cy-surface2:#29224A;--cy-ink:#FFF7E6;--cy-mut:#A99BCB;--cy-outline:#FFF7E6;--cy-accent:#FF6B6B;--cy-accent2:#5CC8FF;--cy-accent3:#FFD45C;--cy-accent4:#5AD98A;--cy-dots:rgba(255,247,230,.06);
  --cy-work:#5AD98A;--cy-idle:#5C557A;--cy-unread:#FF6B6B;--cy-error:#FF7A7A}
.d-crayon{font-family:'Nunito',sans-serif}
.d-crayon .stage-bar{background:var(--cy-accent3); border-bottom:3px solid var(--cy-outline); justify-content:flex-start}
.d-crayon .tl i{border:2px solid var(--cy-outline); background:var(--cy-surface)}
.d-crayon .tl i:nth-child(1){background:var(--cy-accent)}.d-crayon .tl i:nth-child(2){background:var(--cy-accent2)}
.d-crayon .win-title{font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:#1F1A2E}
.d-crayon .appbar{border-bottom:3px solid var(--cy-outline); background:var(--cy-surface)}
.d-crayon .brand-name{font-family:'Fredoka',sans-serif; font-weight:700; font-size:24px; letter-spacing:-.01em}
.d-crayon .brand-name em{font-style:normal; color:var(--cy-accent)}
.d-crayon .brand-mark{background:var(--cy-accent); border:2.5px solid var(--cy-outline); border-radius:9px; color:#fff}
.d-crayon .brand-mark svg{width:14px;height:14px;stroke-width:3}
.d-crayon .iconbtn{border:2px solid var(--cy-outline); border-radius:12px; background:var(--cy-surface); color:var(--cy-ink); box-shadow:2px 2px 0 var(--cy-outline)}
.d-crayon .iconbtn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--cy-outline)}
.d-crayon .iconbtn svg{stroke-width:2.2}
.d-crayon .sidebar{border-right:3px solid var(--cy-outline); background:var(--cy-surface)}
.d-crayon .side-head{border-bottom:2px solid var(--cy-outline)}
.d-crayon .side-label{font-family:'Fredoka'; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.02em; color:var(--cy-ink)}
.d-crayon .tabs{border-bottom:3px solid var(--cy-outline)}
.d-crayon .tab{font-family:'Fredoka'; font-weight:600; font-size:13px; color:var(--cy-ink); border-right:2px solid var(--cy-outline)}
.d-crayon .tab:last-child{border-right:none}
.d-crayon .tab.active{background:var(--cy-accent); color:#fff}
.d-crayon .tab.active em{color:#fff}
.d-crayon .task{border-left:none}
.d-crayon .task-row{border:2.5px solid var(--cy-outline); border-radius:14px; margin:7px 8px; box-shadow:3px 3px 0 var(--cy-outline), inset 5px 0 0 var(--c); background:var(--cy-surface)}
.d-crayon .task-row:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--cy-outline), inset 5px 0 0 var(--c)}
.d-crayon .task-title{font-family:'Fredoka'; font-weight:700}
.d-crayon .task-sub{color:var(--cy-mut); font-weight:600}
.d-crayon .term{border:2px solid var(--cy-outline); border-radius:12px; margin:4px 10px; box-shadow:2px 2px 0 var(--cy-outline); background:var(--cy-surface2); color:var(--cy-ink)}
.d-crayon .term:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--cy-outline)}
.d-crayon .dot.idle{background:var(--cy-idle)}
.d-crayon .dot.working{background:var(--cy-work)}.d-crayon .dot.working::before{border-color:var(--cy-work)}
.d-crayon .dot.unread{background:var(--cy-unread)}.d-crayon .dot.unread::before{border-color:var(--cy-unread)}
.d-crayon .dot.error{background:var(--cy-error)}
.d-crayon .pane{background:var(--cy-bg)}
.d-crayon .term-head{border-bottom:3px solid var(--cy-outline); background:var(--cy-surface2)}
.d-crayon .term-tab{font-family:'Fredoka'; font-weight:600; color:var(--cy-ink); border:2px solid var(--cy-outline); border-bottom:none; background:var(--cy-surface); border-radius:11px 11px 0 0}
.d-crayon .term-tab.active{background:var(--cy-accent2); color:#1F1A2E}
.d-crayon .term-meta{font-family:'Fredoka'; font-weight:700; font-size:11px; text-transform:uppercase; color:var(--cy-work)}
.d-crayon .term-body{font-family:'JetBrains Mono',monospace; color:var(--cy-ink); background-color:var(--cy-surface); background-image:radial-gradient(var(--cy-dots) 1.3px, transparent 1.3px); background-size:15px 15px}
.d-crayon .t-prompt{color:var(--cy-accent2)}
.d-crayon .t-ok{color:var(--cy-work)}
.d-crayon .t-key{color:var(--cy-accent4)}
.d-crayon .t-url{color:var(--cy-accent2)}
.d-crayon .t-info{color:var(--cy-unread)}
